name: OCR proefmeting Almere

on:
  workflow_dispatch:
    inputs:
      page:
        description: "Paginanummer van het vaste openbare testdocument"
        required: true
        default: "387"
        type: string
      dpi:
        description: "Renderresolutie"
        required: true
        default: "300"
        type: choice
        options:
          - "200"
          - "250"
          - "300"
          - "350"

permissions:
  contents: read

concurrency:
  group: almere-ocr-manual-probe
  cancel-in-progress: false

jobs:
  probe:
    name: OCR volledige pagina
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4
      - name: OCR hulpmiddelen installeren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng
      - name: Volledige pagina lezen op hoge resolutie
        env:
          PAGE: ${{ inputs.page }}
          DPI: ${{ inputs.dpi }}
        run: python3 scripts/ocr_probe.py --page "$PAGE" --dpi "$DPI"
