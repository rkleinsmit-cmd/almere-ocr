name: Almere feitencontrole pilot (handmatig)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: almere-verification-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Eén dossier onderzoeken
        env:
          DATABASE_URL: ${{ secrets.ALMERE_DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/verification_pilot.py
