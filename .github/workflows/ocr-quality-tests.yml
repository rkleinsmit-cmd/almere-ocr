name: OCR quality code tests

on:
  push:
    paths:
      - "scripts/ocr_quality_benchmark.py"
      - "scripts/test_ocr_quality_benchmark.py"
      - ".github/workflows/ocr-quality-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent quality metric calculations
        run: python3 -m unittest discover -s scripts -p "test_ocr_quality_benchmark.py" -v
