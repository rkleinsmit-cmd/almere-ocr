name: OCR wachtrij worker

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: almere-ocr-queue-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng
      - name: Claim and process at most one queued page
        run: python3 scripts/ocr_queue_worker.py
