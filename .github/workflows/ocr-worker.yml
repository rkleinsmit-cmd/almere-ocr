name: OCR wachtrij worker
# Acceptance test: retry with explicit short-page classification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ocr-worker.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: almere-ocr-queue-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng
      - name: Run bounded batch of up to 25 successful pages
        run: |
          failures=0
          for i in $(seq 1 35); do
            echo "Attempt $i of 35"
            if python3 scripts/ocr_queue_worker.py; then
              :
            else
              failures=$((failures + 1))
            fi
          done
          echo "Failed attempts: $failures"
